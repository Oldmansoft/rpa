[package]
name = "rpa_native_host"
version = "1.0.0"
edition = "2021"
description = "RPA browser extension native messaging host (Rust port)"

[[bin]]
name = "rpa_native_host"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }
